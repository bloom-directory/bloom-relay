[workspace]

[package]
name = "bloom-relay-deployed-smoke"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bloom-relay-admin-client = { path = "../../crates/bloom-relay-admin-client" }
bloom-relay-client = { path = "../../crates/bloom-relay-client" }
bloom-relay-protocol = { path = "../../crates/bloom-relay-protocol" }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4.3"
rand = "0.8.5"
rcgen = "0.14.7"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1.24.1", features = ["v4"] }
