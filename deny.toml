[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "CC0-1.0", "CDLA-Permissive-2.0",
  "BSL-1.0", "Unlicense", "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
