[workspace]
resolver = "3"
members = [
  "crates/bloom-relay-protocol",
  "crates/bloom-relay-client",
  "crates/bloom-relay-admin-client",
  "crates/bloom-relay",
  "crates/bloom-relay-control",
  "crates/bloom-relay-store",
  "crates/bloom-relay-dns",
  "crates/bloom-relay-ct",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bloom-relay-protocol = { path = "crates/bloom-relay-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_jcs = "0.2.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "signal", "sync"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
h2 = "0.4.16"
http = "1.3.1"
bytes = "1.11.1"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
rand = "0.8.8"
base64 = "0.22.1"
sha2 = "0.10.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "migrate", "macros"] }
data-encoding = "2.11.1"
rustls-pemfile = "2.2.0"
futures-util = "0.3.31"
hex = "0.4.3"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
aws-sdk-route53 = "1.124.0"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
aws-config = { version = "1.12.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
