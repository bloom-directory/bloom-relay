name: Relay
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: relaytest
          POSTGRES_DB: relaytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relaytest"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      BLOOM_RELAY_TEST_DATABASE_URL: postgres://postgres:relaytest@127.0.0.1:5432/relaytest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  borrower-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo +1.85.0 check -p bloom-relay-protocol -p bloom-relay-admin-client -p bloom-relay-client --locked
