name: Relay
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: relaytest
          POSTGRES_DB: relaytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relaytest"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      BLOOM_RELAY_TEST_DATABASE_URL: postgres://postgres:relaytest@127.0.0.1:5432/relaytest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Test tunnel routing through HAProxy 3.0
        env:
          BLOOM_RELAY_TEST_HAPROXY_IMAGE: haproxy:3.0-alpine
        run: cargo test -p bloom-relay --bin bloom-relay haproxy_h2_routes_authenticated_tunnels_across_backend_connections --locked -- --ignored
      - name: Test tunnel routing through HAProxy 3.2
        env:
          BLOOM_RELAY_TEST_HAPROXY_IMAGE: haproxy:3.2-alpine
        run: cargo test -p bloom-relay --bin bloom-relay haproxy_h2_routes_authenticated_tunnels_across_backend_connections --locked -- --ignored
      - run: cargo fmt --manifest-path tools/deployed-smoke/Cargo.toml --all -- --check
      - run: cargo check --manifest-path tools/deployed-smoke/Cargo.toml --locked
      - run: cargo clippy --manifest-path tools/deployed-smoke/Cargo.toml --locked -- -D warnings
      - run: bash -n scripts/package-release.sh
  borrower-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo +1.85.0 check -p bloom-relay-protocol -p bloom-relay-admin-client -p bloom-relay-client --locked
  dependency-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories bans licenses sources
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly fuzz run client_hello -- -runs=1000 -max_len=65537
      - run: cargo +nightly fuzz run control_frames -- -runs=1000 -max_len=16385
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - run: scripts/package-release.sh
      - run: scripts/check-package-template.sh
      - uses: actions/upload-artifact@v4
        with:
          name: relay-linux-package
          path: dist/*.tar.gz*
